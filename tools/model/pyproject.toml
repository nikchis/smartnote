[project]
name = "smartnote-model"
version = "1"
description = "Reproducible preparation of the Smartnote search model (pruned, partly int8 multilingual-e5-small)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.31.1",
    "tokenizers>=0.23.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
