[workspace]
members = ["model-tool", "zalloc", "worker"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# A panic must not unwind through the worker (spec §6.2); dev builds behave the same,
# so the probe binaries of the tests abort like the release worker.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"
