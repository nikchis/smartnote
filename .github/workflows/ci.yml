name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the comment names the
# release): a moved tag cannot change what builds the packages.

env:
  WAILS_VERSION: v3.0.0
  TASK_VERSION: v3.54.0
  NODE_VERSION: "24"
  # Wails v3 needs GTK 4 and WebKitGTK 6.0 headers to compile on Linux (cgo).
  LINUX_PACKAGES: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: go install github.com/go-task/task/v3/cmd/task@$TASK_VERSION
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION
      - run: npm ci
        working-directory: frontend
      # make lint builds the frontend, which generates the bindings svelte-check reads.
      - run: make lint
      - run: npm run check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: go install github.com/go-task/task/v3/cmd/task@$TASK_VERSION
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION
      - run: npm ci
        working-directory: frontend
      - run: make test
      - run: npm run test
        working-directory: frontend

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: go install github.com/go-task/task/v3/cmd/task@$TASK_VERSION
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION
      - run: npm ci
        working-directory: frontend
      - run: make integration

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            artifacts: |
              bin/smartnote.deb
              bin/smartnote-x86_64.AppImage
          - os: windows-latest
            target: windows
            artifacts: bin/*installer.exe
          - os: macos-latest
            target: darwin
            artifacts: bin/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - if: runner.os == 'Windows'
        # choco does not put makensis on PATH for the following steps.
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\NSIS"
      - run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      - run: task package:${{ matrix.target }}
        shell: bash
      # The package must be built from the committed dependency versions.
      - run: git diff --exit-code -- go.mod go.sum frontend/package-lock.json
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smartnote-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  smoke-appimage:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: smartnote-linux
          path: bin
      - run: chmod +x bin/smartnote-x86_64.AppImage
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go install github.com/go-task/task/v3/cmd/task@$TASK_VERSION
      # WebKit starts bubblewrap, which needs unprivileged user namespaces; Ubuntu 24.04
      # runners restrict them through AppArmor, desktops with WebKitGTK allow them for bwrap.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: task smoke:appimage
