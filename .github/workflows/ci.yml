name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs (the comment names the
# release): a moved tag cannot change what builds the packages.

env:
  WAILS_VERSION: v3.0.0
  TASK_VERSION: v3.54.0
  NODE_VERSION: "24"
  # Wails v3 needs GTK 4 and WebKitGTK 6.0 headers to compile on Linux (cgo).
  LINUX_PACKAGES: build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: go install github.com/go-task/task/v3/cmd/task@$TASK_VERSION
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION
      - run: npm ci
        working-directory: frontend
      # make lint builds the frontend, which generates the bindings svelte-check reads.
      - run: make lint
      - run: npm run check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: go install github.com/go-task/task/v3/cmd/task@$TASK_VERSION
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION
      - run: npm ci
        working-directory: frontend
      - run: make test
      - run: npm run test
        working-directory: frontend

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - run: go install github.com/go-task/task/v3/cmd/task@$TASK_VERSION
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION
      - run: npm ci
        working-directory: frontend
      - run: make integration

  search:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain of search/rust-toolchain.toml with rustfmt and clippy.
      - run: rustup toolchain install
        working-directory: search
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: search
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      # task model:fetch and task ort:fetch run Go tools.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install github.com/go-task/task/v3/cmd/task@$TASK_VERSION
      # The model files and the ONNX Runtime library are cached by their lock files; after a
      # restore the fetch tasks check the SHA-256 of the model files and of the library (of the
      # ONNX Runtime notices only that they are present) and download what differs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/model
          key: search-model-${{ hashFiles('model.lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ort
          key: search-ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ort.lock.json') }}
      - run: task model:fetch
      - run: task ort:fetch
      # gdb takes the core dump of the allocator test; strace runs the syscall test.
      - run: sudo apt-get update && sudo apt-get install -y gdb strace
      # Landlock ABI (landlock_create_ruleset with LANDLOCK_CREATE_RULESET_VERSION, syscall 444)
      # and the kernel LSM list, so a sandbox failure can be matched to the runner kernel.
      - name: Kernel diagnostics
        run: |
          uname -r
          cat /sys/kernel/security/lsm; echo
          python3 -c 'import ctypes; libc = ctypes.CDLL(None, use_errno=True); print("landlock abi:", libc.syscall(444, None, ctypes.c_size_t(0), ctypes.c_uint32(1)), "errno:", ctypes.get_errno())'
          sysctl kernel.yama.ptrace_scope kernel.core_pattern
      - run: make search-lint
      # Includes the dump test with the release profile and, with SEARCH_MODEL=1, the tests that
      # need the model (see Makefile). ONNX Runtime must not start its telemetry client in any
      # test process (the Makefile sets the variable too).
      - run: make search-test SEARCH_MODEL=1
        env:
          ORT_DISABLE_TELEMETRY: "1"

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            artifacts: |
              bin/smartnote.deb
              bin/smartnote-x86_64.AppImage
          - os: windows-latest
            target: windows
            artifacts: bin/*installer.exe
          - os: macos-latest
            target: darwin
            artifacts: bin/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - if: runner.os == 'Windows'
        # choco does not put makensis on PATH for the following steps.
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "${env:ProgramFiles(x86)}\NSIS"
      - run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}
      # task package builds the search worker (task search:build) with the toolchain of
      # search/rust-toolchain.toml for the runner's own target.
      - run: rustup toolchain install
        working-directory: search
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: search
      # The model files and the ONNX Runtime library that task package fetches, cached by their
      # lock files as in the search job. After a restore the fetch tasks check the SHA-256 of the
      # model files and of the library; of the ONNX Runtime notices (LICENSE,
      # ThirdPartyNotices.txt) only that they are present, a missing one fetches the archive again.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/model
          key: search-model-${{ hashFiles('model.lock.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ort
          key: search-ort-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ort.lock.json') }}
      - run: task package:${{ matrix.target }}
        shell: bash
      # The packaged search worker must load its ONNX Runtime and model: on macOS from the signed
      # bundle (the library keeps its pinned SHA-256), on Windows from the files the installer
      # takes. The Linux packages are checked by task package:linux (.deb) and smoke-appimage.
      - if: runner.os == 'macOS'
        run: >-
          go run ./cmd/searchsmoke -timeout 120s
          -worker "$PWD/bin/smartnote.app/Contents/MacOS/smartnote-search"
          -ort "$PWD/bin/smartnote.app/Contents/MacOS/libonnxruntime.1.31.0.dylib"
          -model "$PWD/bin/smartnote.app/Contents/Resources/model"
        env:
          ORT_DISABLE_TELEMETRY: "1"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          go run ./cmd/searchsmoke -timeout 120s
          -worker "$PWD\bin\smartnote-search.exe"
          -ort "$PWD\build\ort\onnxruntime.dll"
          -model "$PWD\build\model"
        env:
          ORT_DISABLE_TELEMETRY: "1"
      # The package must be built from the committed dependency versions.
      - run: git diff --exit-code -- go.mod go.sum frontend/package-lock.json
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smartnote-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  smoke-appimage:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: smartnote-linux
          path: bin
      - run: chmod +x bin/smartnote-x86_64.AppImage
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go install github.com/go-task/task/v3/cmd/task@$TASK_VERSION
      # WebKit starts bubblewrap, which needs unprivileged user namespaces; Ubuntu 24.04
      # runners restrict them through AppArmor, desktops with WebKitGTK allow them for bwrap.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Also runs the search worker of the AppImage with a static build of cmd/searchsmoke.
      - run: task smoke:appimage
