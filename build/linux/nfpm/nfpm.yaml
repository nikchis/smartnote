# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "smartnote"
arch: ${GOARCH}
platform: "linux"
version: "2.1.0"
section: "default"
priority: "extra"
maintainer: "Nikita Chisnikov <chisnikov@gmail.com>"
description: "A notepad for private records"
vendor: "Nikita Chisnikov"
homepage: "https://github.com/nikchis/smartnote"
license: "MIT"
release: "1"

contents:
  - src: "./bin/smartnote"
    dst: "/usr/local/bin/smartnote"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/smartnote.png"
  # Named after the GTK application id (linuxAppID in cmd/smartnote), so Wayland desktops match the window with it.
  - src: "./build/linux/smartnote.desktop"
    dst: "/usr/share/applications/com.nikchis.smartnote.desktop"
  # AppStream metadata for software centres, named after the same id.
  - src: "./build/linux/com.nikchis.smartnote.metainfo.xml"
    dst: "/usr/share/metainfo/com.nikchis.smartnote.metainfo.xml"
    file_info:
      mode: 0644
  # Search (specification 8.2): the worker and ONNX Runtime beside the application's lib directory,
  # the model in its share directory. task search:files prepares them.
  - src: "./bin/smartnote-search"
    dst: "/usr/local/lib/smartnote/smartnote-search"
    file_info:
      mode: 0755
  - src: "./build/ort/libonnxruntime.so.1.31.0"
    dst: "/usr/local/lib/smartnote/libonnxruntime.so.1.31.0"
    file_info:
      mode: 0644
  - src: "./build/model/model.onnx"
    dst: "/usr/local/share/smartnote/model/model.onnx"
    file_info:
      mode: 0644
  - src: "./build/model/tokenizer.kit"
    dst: "/usr/local/share/smartnote/model/tokenizer.kit"
    file_info:
      mode: 0644
  - src: "./build/model/manifest.json"
    dst: "/usr/local/share/smartnote/model/manifest.json"
    file_info:
      mode: 0644
  # Licence notices of the third-party components (THIRD_PARTY_NOTICES.md).
  - src: "./THIRD_PARTY_NOTICES.md"
    dst: "/usr/share/doc/smartnote/THIRD_PARTY_NOTICES.md"
    file_info:
      mode: 0644
  - src: "./build/ort/LICENSE"
    dst: "/usr/share/doc/smartnote/licenses/onnxruntime/LICENSE"
    file_info:
      mode: 0644
  - src: "./build/ort/ThirdPartyNotices.txt"
    dst: "/usr/share/doc/smartnote/licenses/onnxruntime/ThirdPartyNotices.txt"
    file_info:
      mode: 0644
  - src: "./build/notices/rust-crates.txt"
    dst: "/usr/share/doc/smartnote/licenses/rust-crates.txt"
    file_info:
      mode: 0644
  - src: "./build/notices/go-modules.txt"
    dst: "/usr/share/doc/smartnote/licenses/go-modules.txt"
    file_info:
      mode: 0644

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
# fonts-liberation: the interface font, Liberation Sans; fonts-dejavu-core: DejaVu Sans Mono, the font of the notes.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - fonts-liberation
  - fonts-dejavu-core

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - liberation-sans-fonts
      - dejavu-sans-mono-fonts

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
      - ttf-liberation
      - ttf-dejavu

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
#   - fonts-liberation
#   - fonts-dejavu-core
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#       - liberation-sans-fonts
#       - dejavu-sans-mono-fonts
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#       - ttf-liberation
#       - ttf-dejavu
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
